# BioKG-LoRA Docker Compose
#
# Usage:
#   docker compose up kg          # Stage 0: Build KG (CPU-intensive, no GPU needed)
#   docker compose up rotate      # Stage 1: Train RotatE embeddings
#   docker compose up projection  # Stage 2: Train projection layer
#   docker compose up lora        # Stage 3: Fine-tune with LoRA
#   docker compose up pipeline    # All stages (0 → 1 → 2 → 3)
#   docker compose run predict    # Interactive prediction mode
#
# GPU selection (override at runtime or set in .env):
#   GPU_ID=0 docker compose up rotate        # use GPU 0 (default)
#   GPU_ID=1 docker compose up lora          # use GPU 1
#   GPU_ID=0,1 docker compose up pipeline    # use GPUs 0 and 1

version: "3.9"

x-common: &common
  image: biokg-lora:latest
  build:
    context: .
    dockerfile: Dockerfile
    target: app
  volumes:
    # Persistent data: raw data must be placed here before running Stage 0
    - ./data:/workspace/biokg/data
    # Persistent checkpoints
    - ./checkpoints:/workspace/biokg/checkpoints
    # Persistent logs
    - ./logs:/workspace/biokg/logs
    # HuggingFace model cache (avoids re-downloading on restart)
    - hf_cache:/workspace/hf_cache
  environment:
    - PYTHONPATH=/workspace/biokg
    - HF_HOME=/workspace/hf_cache
    - TRANSFORMERS_CACHE=/workspace/hf_cache/transformers
    # Set your HuggingFace token if using gated models (Llama)
    - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    # GPU selection — controls which physical GPU(s) the container sees.
    # Set GPU_ID in .env or inline: GPU_ID=1 docker compose up rotate
    - NVIDIA_VISIBLE_DEVICES=${GPU_ID:-0}
    - CUDA_VISIBLE_DEVICES=${GPU_ID:-0}
  restart: "no"

# GPU device fragment — referenced by every GPU-using service
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${GPU_ID:-0}"]
            capabilities: [gpu]

# ─────────────────────────────────────────────────────────────────────────────
# Individual stage services
# ─────────────────────────────────────────────────────────────────────────────

services:

  # Stage 0: KG construction + QA generation (CPU-only, heavy RAM)
  kg:
    <<: *common
    container_name: biokg_stage0
    command: ["--stage", "0"]
    # No GPU needed for Stage 0
    deploy:
      resources:
        limits:
          memory: 32g

  # Stage 1: RotatE embedding training (GPU, 2-3 days)
  rotate:
    <<: [*common, *gpu]
    container_name: biokg_stage1
    command: ["--stage", "1"]

  # Resume RotatE from checkpoint
  rotate-resume:
    <<: [*common, *gpu]
    container_name: biokg_stage1_resume
    command: ["--stage", "1", "--resume"]

  # Stage 2: Projection layer training (GPU, ~2 hours)
  projection:
    <<: [*common, *gpu]
    container_name: biokg_stage2
    command: ["--stage", "2"]
    depends_on:
      rotate:
        condition: service_completed_successfully

  # Stage 3: LoRA fine-tuning (GPU, 4-6 hours)
  lora:
    <<: [*common, *gpu]
    container_name: biokg_stage3
    command: ["--stage", "3"]
    depends_on:
      projection:
        condition: service_completed_successfully

  # Resume LoRA from checkpoint
  lora-resume:
    <<: [*common, *gpu]
    container_name: biokg_stage3_resume
    command: ["--stage", "3", "--resume"]

  # Full pipeline: all stages from scratch
  pipeline:
    <<: [*common, *gpu]
    container_name: biokg_pipeline
    command: ["--from-scratch"]

  # Evaluation only (no training)
  eval:
    <<: [*common, *gpu]
    container_name: biokg_eval
    command: ["--eval-only"]

  # Interactive prediction (docker compose run predict --predict "...")
  predict:
    <<: [*common, *gpu]
    container_name: biokg_predict
    stdin_open: true
    tty: true
    entrypoint: ["python", "train.py"]
    command: []

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  hf_cache:
    driver: local
